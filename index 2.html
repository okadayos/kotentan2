<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>古文単語315 フラッシュカード</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f3ec;--fg:#2b2622;--card:#fffdf8;--mut:#7a7066;--acc:#9c3b2e;--bd:#ddd5c6}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1b19;--fg:#ece6da;--card:#272421;--mut:#a39a8d;--acc:#e0806f;--bd:#3d3833}}
:root[data-theme="dark"]{--bg:#1d1b19;--fg:#ece6da;--card:#272421;--mut:#a39a8d;--acc:#e0806f;--bd:#3d3833}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 "Hiragino Mincho ProN","Yu Mincho",serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:4px 0 12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px;margin-bottom:12px}
select,button,textarea,input[type=text]{font:inherit;font-size:14px;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 8px}
button{cursor:pointer}button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
#card{min-height:300px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:24px;cursor:pointer;display:flex;flex-direction:column;justify-content:center;text-align:center;user-select:none}
#card .w{font-size:40px;font-weight:700;color:var(--acc);line-height:1.3}
#card .g{color:var(--mut);font-size:14px}
#card ul{list-style:none;padding:0;margin:8px 0;text-align:left;display:inline-block}
#card .ex{margin-top:12px;padding-top:12px;border-top:1px dashed var(--bd);text-align:left}
#card .tr{color:var(--mut);font-size:14px;text-align:left}
#card .hint{color:var(--mut);font-size:12px;margin-top:14px}
#card b{color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent);border-radius:3px;padding:0 2px}
.ctl{display:flex;gap:8px;margin:12px 0}.ctl button{flex:1;padding:10px}
.st{color:var(--mut);font-size:13px;text-align:center}
details{margin-top:20px;font-size:14px}textarea{width:100%;height:120px;margin:6px 0}
input[type=text]{width:100%;margin:3px 0}#as{height:70px}
</style></head><body><main>
<h1>古文単語315 フラッシュカード</h1>
<div class="bar">
<select id="mode"><option value="0">古語 → 意味</option><option value="1">意味 → 古語</option></select>
<label><input type="checkbox" id="sh" checked> シャッフル</label>
<label><input type="checkbox" id="un"> 未習得のみ</label>
<button id="go" class="p">開始</button>
</div>
<div id="card" tabindex="0"></div>
<div class="ctl"><button id="prev">←</button><button id="no">もう一度</button><button id="ok" class="p">覚えた</button><button id="next">→</button></div>
<div class="st" id="st"></div>
<details id="add"><summary>単語を追加</summary><input type="text" id="aw" placeholder="古語(例: ありがたし)"><input type="text" id="ag" placeholder="品詞・活用(例: ク活用)"><textarea id="as" placeholder="意味(1行に1つ。例: ①めったにない・まれである)"></textarea><input type="text" id="ae" placeholder="例文(強調したい部分を **こう** で囲む)"><input type="text" id="at" placeholder="現代語訳(強調は同様に **こう**)"><button id="addb" class="p">追加</button> <span id="am" class="st"></span></details>
<details><summary>データ書き出し・リセット</summary>
<button id="exp">書き出し(JSON)</button> <button id="reset">学習記録をリセット</button> <span id="msg" class="st"></span>
<textarea id="ta" readonly></textarea></details>
<script>
const WORDS=[
 {
  "id": 1,
  "word": "見る",
  "gram": "マ行上一段",
  "senses": [
   "①見る・会う",
   "②思う・分かる",
   "③関係を結ぶ・結婚する",
   "④面倒を見る・世話をする"
  ],
  "ex": "めでたしと**みる**人の、",
  "tr": "素晴らしいと**思う**人が、"
 },
 {
  "id": 2,
  "word": "見す",
  "gram": "サ行下二段",
  "senses": [
   "①見せる",
   "②結婚させる"
  ],
  "ex": "親王たちにこそは**見せ**奉らめ",
  "tr": "親王たちと**結婚させ**申し上げるのがよかろう"
 },
 {
  "id": 3,
  "word": "見ゆ",
  "gram": "ヤ行下二段",
  "senses": [
   "①見える・思われる",
   "②見せる",
   "③（女性が）結婚する"
  ],
  "ex": "都の中とも**見え**ぬ所のさまなり",
  "tr": "都の中とも**見え（思われ）**ない場所の様子である"
 },
 {
  "id": 4,
  "word": "かいまみる（垣間見る）",
  "gram": "マ行上一段",
  "senses": [
   "①のぞき見る"
  ],
  "ex": "その里に、いとなまめいたる女はらから住みけり。この男**かいまみ**てけり",
  "tr": "その里に、たいそう若々しく美しい姉妹が住んでいた。この男は（その姉妹を）**のぞき見て**しまった"
 },
 {
  "id": 5,
  "word": "よばふ（呼ばふ）",
  "gram": "ハ行四段",
  "senses": [
   "①呼び続ける",
   "②求婚する・言い寄る"
  ],
  "ex": "**よばふ**人も多かりけれど",
  "tr": "**求婚する**人も実に多かったが"
 },
 {
  "id": 6,
  "word": "好く",
  "gram": "ラ行四段",
  "senses": [
   "①風流を好む・芸道に熱中する",
   "②色ごとを好む・恋愛に熱中する"
  ],
  "ex": "ひとへに**すける**様にも見えず",
  "tr": "ひたすら**風流を好んで**いるようにも見えず"
 },
 {
  "id": 7,
  "word": "わたる（渡る）",
  "gram": "ラ行四段",
  "senses": [
   "①通る・行く・来る",
   "②いらっしゃる",
   "③（～し）続ける",
   "④一面に（～する）"
  ],
  "ex": "後涼殿の間を**渡り**ければ",
  "tr": "後涼殿のすき間を**通った**ところ"
 }
];
const $=s=>document.querySelector(s);
const ls=(k,v)=>{try{return v===undefined?localStorage.getItem(k):localStorage.setItem(k,v)}catch(e){return null}};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const hl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/\*\*/g,'');
let ALL=[],deck=[],i=0,flip=false,known=new Set(),extra=[];
function auto(w){if(!w.ex||w.ex.includes('**'))return;
const alts=[...w.word.matchAll(/[（(]([^）)]*)[）)]/g)].flatMap(m=>m[1].split('・'));
const c=[w.word.replace(/[（(].*$/,''),...alts].flatMap(x=>x.split('・')).flatMap(x=>[x,x.slice(0,-1)]).filter(x=>x.length>=2).sort((a,b)=>b.length-a.length);
const h=c.find(x=>w.ex.includes(x));if(h)w.ex=w.ex.replace(h,'**'+h+'**')}
function build(){deck=ALL.filter(w=>!$('#un').checked||!known.has(w.id));
if($('#sh').checked)for(let k=deck.length-1;k>0;k--){const j=Math.random()*(k+1)|0;[deck[k],deck[j]]=[deck[j],deck[k]]}
i=0;flip=false;show()}
function show(){const c=$('#card');
if(!deck.length){c.innerHTML='<div class="g">該当するカードがありません</div>';$('#st').textContent='';return}
const w=deck[i],rev=$('#mode').value==='1';
const word=`<div class="w">${esc(w.word)}</div><div class="g">${esc(w.gram)}</div>`;
const sen=`<ul>${w.senses.map(s=>`<li>${esc(s)}</li>`).join('')}</ul>`;
const exb=w.ex?`<div class="ex">${hl(w.ex)}</div><div class="tr">${hl(w.tr)}</div>`:'';
let h;
if(!rev)h=flip?word+sen+exb:word+'<div class="hint">タップで意味を表示</div>';
else h=flip?word+sen+exb:`<div style="text-align:center">${sen}</div><div class="hint">タップで古語を表示</div>`;
c.innerHTML=h;
$('#st').textContent=`${i+1} / ${deck.length}  ・  No.${String(w.id).padStart(3,'0')}  ・  覚えた ${known.size} / ${ALL.length}`+(known.has(w.id)?' ✓':'')}
const go=d=>{if(!deck.length)return;i=(i+d+deck.length)%deck.length;flip=false;show()};
const mark=k=>{if(!deck.length)return;const id=deck[i].id;k?known.add(id):known.delete(id);ls('kobun_known',JSON.stringify([...known]));go(1)};
$('#card').onclick=()=>{flip=!flip;show()};
$('#go').onclick=build;$('#mode').onchange=build;
$('#prev').onclick=()=>go(-1);$('#next').onclick=()=>go(1);
$('#ok').onclick=()=>mark(1);$('#no').onclick=()=>mark(0);
$('#reset').onclick=()=>{known=new Set();ls('kobun_known','[]');build()};
$('#exp').onclick=()=>{const t=JSON.stringify(ALL.map(({id,word,gram,senses,ex,tr})=>({id,word,gram,senses,ex,tr})),null,1);$('#ta').value=t;const n=`${ALL.length}語を書き出しました`;try{navigator.clipboard.writeText(t).then(()=>$('#msg').textContent=n+'(コピー済み)',()=>$('#msg').textContent=n)}catch(e){$('#msg').textContent=n}};
$('#addb').onclick=()=>{const w=$('#aw').value.trim(),s=$('#as').value.split(/\n/).map(x=>x.trim()).filter(Boolean);
if(!w||!s.length){$('#am').textContent='古語と意味は必須です';return}
const e={id:Math.max(315,...ALL.map(x=>x.id))+1,word:w,gram:$('#ag').value.trim(),senses:s,ex:$('#ae').value.trim(),tr:$('#at').value.trim()};
auto(e);extra.push(e);ls('kobun_extra',JSON.stringify(extra));ALL=ALL.concat(e);
['aw','ag','as','ae','at'].forEach(k=>$('#'+k).value='');$('#am').textContent='追加しました';build()};
document.onkeydown=e=>{if(/TEXTAREA|INPUT|SELECT/.test(e.target.tagName))return;
if(e.key===' '||e.key==='Enter'){e.preventDefault();flip=!flip;show()}else if(e.key==='ArrowRight')go(1);else if(e.key==='ArrowLeft')go(-1)};
let saved=[];
try{known=new Set(JSON.parse(ls('kobun_known')||'[]'));extra=JSON.parse(ls('kobun_extra')||'[]');saved=JSON.parse(ls('kobun_db')||'[]')}catch(e){}
ALL=[...new Map([...saved,...WORDS].map(w=>[w.id,w])).values()].sort((a,b)=>a.id-b.id).concat(extra);
build();
</script></main></body></html>
